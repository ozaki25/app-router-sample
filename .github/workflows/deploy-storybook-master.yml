name: Deploy Storybook to master folder

on:
  push:
    branches:
      - master

jobs:
  deploy-storybook:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Storybook
        run: npm run build-storybook

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy to storybook branch
        run: |
          git fetch origin storybook:storybook 2>/dev/null || true
          git checkout storybook 2>/dev/null || git checkout --orphan storybook
          
          mkdir -p master
          rm -rf master/*
          cp -r storybook-static/* master/
          
          git add master
          git commit -m "Deploy Storybook for master branch" || exit 0
          git push origin storybook
